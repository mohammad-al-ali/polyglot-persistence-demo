server.port=8081

spring.application.name=polyglot-persistence-demo

# MySQL holds Quantity/inventory data
spring.datasource.url=jdbc:mysql://localhost:3306/polyglot_demo_mysql
spring.datasource.username=root
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MongoDB holds the Product catalog
spring.data.mongodb.uri=mongodb://localhost:27017/polyglot_demo_mongo

logging.level.com.acquaintech.demo.polyglot=DEBUG
